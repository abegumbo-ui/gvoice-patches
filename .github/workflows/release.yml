name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon
          ls -la patches/build/libs

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' gradle.properties | cut -d= -f2 | tr -d ' ')
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          MPP=$(ls patches/build/libs/*.mpp | grep -v -e sources -e javadoc | head -1)
          cp "$MPP" "gvoice-patches-${VERSION}-${GITHUB_RUN_NUMBER}.mpp"
          gh release create "$TAG" "gvoice-patches-${VERSION}-${GITHUB_RUN_NUMBER}.mpp" \
            --title "$TAG" --notes "Google Voice patches build ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7})."
